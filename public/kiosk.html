<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Avian Time – Kiosk</title>

  <!-- Fixed: make these root-relative so they load at /kiosk -->
  <link rel="stylesheet" href="/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta name="theme-color" content="#0c816d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Avian Kiosk" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">

  <style>
  :root {
    --ink-950: #040707;
    --ink-900: #0b1513;
    --ink-800: #14211e;
    --ink-600: #33423e;
    --ink-500: #4a5c57;
    --paper-100: #fffdf9;
    --paper-200: #f7f3ed;
    --paper-300: #ebe4db;
    --teal-700: #0c816d;
    --teal-600: #0f927c;
    --teal-500: #12a48b;
    --teal-300: #8bd9c7;
    --teal-100: #e1f4ef;
    --shadow-lg: 0 40px 90px rgba(4, 7, 7, 0.5);
    --shadow-md: 0 20px 45px rgba(4, 7, 7, 0.35);
    --radius-xl: 30px;
    --radius-lg: 22px;
    --radius-md: 16px;
    --kiosk-pill-height: 58px;
    --kiosk-pill-radius: 18px;
    --kiosk-head-shift: 22px;
    --kiosk-select-bg:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23727b82' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='8' r='3.6'/><path d='M4.8 19.5c1.9-3.8 12.5-3.8 14.4 0'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23727b82' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"),
      linear-gradient(180deg, #ffffff 0%, #f2f4f7 100%);
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    font-family: 'Montserrat', sans-serif;
    color: var(--ink-900);
    background-color: #fff6ec;
    background-image: url('/images/wsplash2.jpg');
    background-repeat: no-repeat;
    background-position: center bottom;
    background-size: 100% auto;
    display: block;
    width: 100%;
  }

  .glass-shell {
    position: relative;
    min-height: 100vh;
    width: 100vw;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 0 28px 64px;
    overflow: hidden;
    z-index: 1;
  }

  .glass-card {
    width: min(720px, 92vw);
    min-height: auto;
    margin-inline: auto;
    background: transparent;
    border-radius: 0;
    border: none;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    padding: 0 32px 96px;
    position: relative;
    z-index: 1;
    overflow: visible;
    color: var(--ink-900);
    animation: kiosk-card-in 0.6s ease-out;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
  }

  .glass-panel {
    width: min(560px, 100%);
    margin: 0 auto;
    padding: 0 32px 36px;
    border-radius: 32px;
    background: transparent;
    border: none;
    box-shadow: none;
    position: relative;
    z-index: 1;
  }

  .glass-card::before {
    content: none;
  }

  .glass-card::after {
    content: none;
  }

  .glass-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--paper-300);
    animation: kiosk-fade 0.5s ease-out 0.1s both;
  }

  .glass-brand {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .glass-title {
    font-size: 0.8rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--ink-800);
    font-weight: 700;
  }

  .kiosk-project-display {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0;
    border-radius: 0;
    background: transparent;
    color: #2d3539;
    font-size: 0.95rem;
    font-weight: 500;
    border: none;
    box-shadow: none;
  }

  .kiosk-project-prefix {
    letter-spacing: 0;
    text-transform: none;
    font-weight: inherit;
  }

  #kiosk-project-name {
    font-weight: 500;
    color: var(--teal-700);
    max-width: 240px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .glass-header-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    margin-left: auto;
  }

  .kiosk-project-top {
    position: static;
    margin-top: 6px;
    justify-content: center;
    text-align: center;
    z-index: 3;
  }

  .kiosk-geo-banner {
    margin: 12px auto 0;
    padding: 10px 14px;
    border-radius: 14px;
    background: #fff4e5;
    border: 1px solid #f2c18b;
    color: #8a4b00;
    font-size: 0.9rem;
    text-align: center;
    max-width: min(560px, 100%);
  }

  .lang-switch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0;
    height: var(--kiosk-pill-height);
    padding: 4px;
    width: 100%;
    box-sizing: border-box;
    justify-self: stretch;
    margin-inline: auto;
    background: linear-gradient(180deg, #ffffff 0%, #f2f4f7 100%);
    border: 1px solid #cfd4da;
    border-radius: var(--kiosk-pill-radius);
    box-shadow: 0 10px 20px rgba(20, 28, 35, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }

  .lang-switch-footer {
    position: static;
    margin-top: 0;
    width: 100%;
  }

  .lang-btn {
    position: relative;
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 100%;
    padding: 0 16px;
    border-radius: calc(var(--kiosk-pill-radius) - 4px);
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 500;
    color: #3a424a;
    white-space: nowrap;
    transition: background 0.2s ease, box-shadow 0.2s ease, color 0.2s ease, transform 0.2s ease;
  }

  .lang-btn::after {
    content: '';
    position: absolute;
    top: 24%;
    right: -1px;
    width: 1px;
    height: 52%;
    background: #d5dbe1;
  }

  .lang-btn:last-child::after {
    content: none;
  }

  .lang-icon {
    display: none;
  }

  .lang-btn:focus-visible {
    outline: 2px solid rgba(12, 129, 109, 0.45);
    outline-offset: 2px;
  }

  .lang-btn.active {
    transform: translateY(-1px);
    background: linear-gradient(180deg, #2f8b67 0%, #25795b 100%);
    color: #ffffff;
    box-shadow: 0 9px 16px rgba(20, 28, 35, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    z-index: 1;
  }

  .glass-body {
    display: grid;
    gap: 28px;
    margin-top: clamp(32px, 5vh, 72px);
    text-align: center;
    justify-items: center;
  }

  .glass-body > * {
    animation: kiosk-rise 0.6s ease-out both;
  }

  .glass-body > *:nth-child(1) { animation-delay: 0.2s; }
  .glass-body > *:nth-child(2) { animation-delay: 0.28s; }
  .glass-body > *:nth-child(3) { animation-delay: 0.36s; }
  .glass-body > *:nth-child(4) { animation-delay: 0.44s; }

  .glass-logo-center {
    display: flex;
    justify-content: center;
  }

  .glass-logo-top {
    margin: 4px 0 6px;
    transform: translateY(var(--kiosk-head-shift));
  }

  .kiosk-heading {
    display: grid;
    gap: 10px;
    text-align: center;
    margin: 10px 0 22px;
    transform: translateY(var(--kiosk-head-shift));
  }

  .kiosk-heading-title {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(1.6rem, 3.4vw, 2.5rem);
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--ink-900);
    line-height: 1.1;
  }

  .kiosk-heading-sub {
    font-family: 'Montserrat', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 0.08em;
    color: var(--ink-600);
    font-weight: 400;
    line-height: 1.2;
    margin-top: 6px;
  }

  .glass-logo {
    width: 170px;
    height: 170px;
    border-radius: 30px;
    background: transparent url('/images/logo.png') center/contain no-repeat;
    border: none;
    box-shadow: none;
    position: relative;
  }

  .glass-logo::after {
    content: none;
  }

  .logo-hotspot {
    position: absolute;
    inset: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }

  .glass-greeting {
    font-size: clamp(2.1rem, 3.2vw, 2.9rem);
    font-weight: 600;
    color: var(--ink-900);
    letter-spacing: 0.01em;
  }

  .kiosk-sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .glass-subline {
    font-size: 1rem;
    color: var(--ink-600);
    line-height: 1.6;
    max-width: 520px;
    margin: 0 auto;
  }

  .glass-form {
    display: block;
    width: min(520px, 100%);
    margin-inline: auto;
    justify-self: center;
  }

  .kiosk-form-stack {
    display: grid;
    gap: 30px;
    transform: translateY(52px);
    width: 100%;
    align-items: center;
    justify-items: stretch;
  }

  .glass-form .glass-btn {
    margin-top: 22px;
  }

  .glass-label {
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.22em;
    color: var(--ink-500);
    text-align: left;
    font-weight: 600;
  }

  .glass-select {
    height: var(--kiosk-pill-height);
    width: 100%;
    justify-self: stretch;
    border-radius: var(--kiosk-pill-radius);
    border: 1px solid #cfd4da;
    padding: 0 56px 0 54px;
    font-size: 1rem;
    font-weight: 500;
    color: #2d3539;
    background-color: #ffffff;
    box-shadow: 0 10px 18px rgba(18, 26, 32, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    appearance: none;
    background-image: var(--kiosk-select-bg);
    background-position: 22px 50%, calc(100% - 22px) 50%, 0 0;
    background-size: 18px 18px, 18px 18px, 100% 100%;
    background-repeat: no-repeat, no-repeat, no-repeat;
    text-align: left;
    transition: border 0.2s ease, box-shadow 0.2s ease;
  }

  .glass-select:focus,
  .glass-select:active {
    background-image: var(--kiosk-select-bg);
    background-position: 22px 50%, calc(100% - 22px) 50%, 0 0;
    background-size: 18px 18px, 18px 18px, 100% 100%;
    background-repeat: no-repeat, no-repeat, no-repeat;
  }

  .glass-select:focus-visible {
    outline: 2px solid rgba(120, 128, 136, 0.35);
    outline-offset: 3px;
    border-color: rgba(162, 169, 176, 0.9);
    box-shadow: 0 0 0 3px rgba(120, 128, 136, 0.12), 0 10px 18px rgba(18, 26, 32, 0.18);
  }

  .glass-select:focus {
    border-color: rgba(162, 169, 176, 0.85);
    box-shadow: 0 0 0 2px rgba(120, 128, 136, 0.1), 0 10px 18px rgba(18, 26, 32, 0.18);
  }

  .glass-btn {
    height: 72px;
    border-radius: var(--radius-md);
    border: none;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #ffffff;
    background: var(--teal-700);
    box-shadow: 0 18px 32px rgba(12, 129, 109, 0.35);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.2s ease, filter 0.2s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .kiosk-btn {
    --kiosk-btn-size: clamp(140px, 21vw, 188px);
    --kiosk-ring: clamp(8px, 1.6vw, 12px);
    position: relative;
    width: var(--kiosk-btn-size);
    height: var(--kiosk-btn-size);
    margin: clamp(52px, 7vh, 96px) auto 0;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #fff5ec 45%, #eef2f8 100%);
    border: 1px solid rgba(216, 208, 196, 0.85);
    box-shadow:
      0 34px 42px rgba(24, 32, 38, 0.2),
      0 14px 22px rgba(24, 32, 38, 0.16),
      0 6px 10px rgba(24, 32, 38, 0.12),
      inset 0 6px 10px rgba(255, 255, 255, 0.85),
      inset 0 -12px 18px rgba(178, 188, 204, 0.28);
    color: #1f272b;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0;
    letter-spacing: 0.18em;
    line-height: 1.2;
  }

  .kiosk-btn::before {
    content: '';
    position: absolute;
    inset: calc(var(--kiosk-ring) * -1);
    border-radius: 50%;
    background: conic-gradient(
      from 210deg,
      #d6d2cc 0deg,
      #f0ece6 110deg,
      #e2ded8 190deg,
      #b3aea8 300deg,
      #d6d2cc 360deg
    );
    box-shadow:
      0 28px 40px rgba(20, 28, 34, 0.28),
      0 10px 24px rgba(96, 96, 96, 0.22),
      0 -8px 14px rgba(224, 216, 208, 0.45);
    z-index: -1;
  }

  .kiosk-btn::after {
    content: '';
    position: absolute;
    inset: calc(var(--kiosk-ring) * 0.55);
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow:
      inset 0 8px 14px rgba(255, 255, 255, 0.7),
      inset 0 -8px 14px rgba(182, 192, 206, 0.22);
    pointer-events: none;
  }

  .kiosk-btn-label {
    font-size: clamp(1rem, 2.4vw, 1.4rem);
    letter-spacing: 0.24em;
    max-width: 70%;
  }

  .kiosk-btn-icon {
    display: none;
  }

  .glass-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 22px 38px rgba(12, 129, 109, 0.4);
    filter: saturate(1.05);
  }

  .kiosk-btn:hover {
    transform: translateY(-2px);
    filter: none;
    box-shadow:
      0 30px 46px rgba(24, 32, 38, 0.22),
      0 12px 20px rgba(24, 32, 38, 0.16),
      inset 0 6px 10px rgba(255, 255, 255, 0.85),
      inset 0 -12px 18px rgba(178, 188, 204, 0.28);
  }

  .glass-btn:active {
    transform: translateY(1px);
  }

  .kiosk-btn:active {
    transform: translateY(0);
  }

  .glass-btn:focus-visible {
    outline: 2px solid rgba(12, 129, 109, 0.4);
    outline-offset: 3px;
  }

  .glass-btn.kiosk-btn-danger {
    background: #c21f17;
    box-shadow: 0 18px 32px rgba(194, 31, 23, 0.38);
  }

  .glass-btn.kiosk-btn-danger:hover {
    box-shadow: 0 22px 38px rgba(194, 31, 23, 0.5);
    filter: saturate(1.05);
  }

  .glass-btn.kiosk-btn-danger:focus-visible {
    outline: 2px solid rgba(194, 31, 23, 0.45);
    outline-offset: 3px;
  }

  .kiosk-btn.kiosk-btn-danger {
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #ffe7e4 48%, #f1c9c5 100%);
    border-color: rgba(196, 92, 86, 0.55);
    color: #8e1c16;
    box-shadow:
      0 28px 42px rgba(120, 24, 20, 0.28),
      0 12px 20px rgba(120, 24, 20, 0.18),
      inset 0 6px 10px rgba(255, 255, 255, 0.85),
      inset 0 -12px 18px rgba(201, 120, 116, 0.36);
  }

  .kiosk-btn.kiosk-btn-danger::before {
    background: conic-gradient(
      from 210deg,
      #d26862 0deg,
      #f0b3ae 120deg,
      #edd4d2 200deg,
      #c3777f 300deg,
      #d26862 360deg
    );
  }

  .glass-status {
    min-height: 24px;
    font-size: 1rem;
    color: var(--ink-600);
    border-radius: var(--radius-md);
    background: transparent;
    border: none;
    box-shadow: none;
    padding: 0;
  }

  .kiosk-status-ok {
    background: var(--teal-100);
    color: var(--teal-700);
    border: 1px solid rgba(12, 129, 109, 0.25);
    border-left: 4px solid var(--teal-600);
    border-radius: var(--radius-md);
    box-shadow: 0 12px 24px rgba(4, 7, 7, 0.1);
    padding: 12px 14px;
  }

  .kiosk-status-error {
    background: #fde8e7;
    color: #b4231b;
    border: 1px solid #fac7c5;
    border-left: 4px solid #b4231b;
    border-radius: var(--radius-md);
    box-shadow: 0 12px 24px rgba(4, 7, 7, 0.1);
    padding: 12px 14px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(4, 7, 7, 0.72);
    backdrop-filter: blur(8px);
    z-index: 50;
    overflow-y: auto;
  }

  #pin-backdrop,
  #admin-login-backdrop {
    background: rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(6px);
    isolation: isolate;
    justify-content: center;
    align-items: center;
    padding: 24px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  .modal {
    width: min(540px, 94vw);
    background: #fffdf9;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 26px 24px;
    border: 1px solid var(--paper-300);
    color: var(--ink-900);
    animation: kiosk-modal-in 0.25s ease-out;
    max-height: calc(100dvh - 48px);
    overflow: auto;
    position: relative;
    pointer-events: auto;
    z-index: 1;
    display: block;
    height: auto;
  }

  body.kiosk-page .modal-backdrop {
    pointer-events: auto;
    z-index: 120;
  }

  body.kiosk-page .modal {
    pointer-events: auto !important;
  }

  body.kiosk-page .modal-input {
    pointer-events: auto;
    touch-action: auto;
    -webkit-user-select: text;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .modal-title {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink-900);
  }

  .close-btn {
    border: none;
    background: #f3eee7;
    width: 34px;
    height: 34px;
    border-radius: 12px;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--ink-600);
  }

  .close-btn:focus-visible {
    outline: 2px solid rgba(12, 129, 109, 0.4);
    outline-offset: 2px;
  }

  .modal-body {
    display: grid;
    gap: 12px;
  }

  .modal-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-500);
    display: grid;
    gap: 8px;
  }

  .modal-input {
    height: 46px;
    border-radius: 12px;
    border: 1px solid var(--paper-300);
    padding: 0 14px;
    font-size: 1rem;
    box-shadow: 0 10px 20px rgba(4, 7, 7, 0.12);
    background: #ffffff;
  }

  .modal-input:focus-visible {
    outline: 2px solid rgba(12, 129, 109, 0.35);
    outline-offset: 2px;
  }

  .modal-status {
    min-height: 18px;
    font-size: 0.9rem;
    color: var(--ink-500);
  }

  .modal-footer {
    margin-top: 14px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .glass-shell .btn {
    border-radius: 12px;
    border: 1px solid transparent;
    padding: 9px 18px;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 0.12s ease, box-shadow 0.2s ease, background 0.2s ease;
  }

  .glass-shell .btn.primary {
    background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
    color: #ffffff;
    box-shadow: 0 12px 24px rgba(12, 129, 109, 0.3);
  }

  .glass-shell .btn.primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 16px 28px rgba(12, 129, 109, 0.35);
  }

  .glass-shell .btn.secondary {
    background: #ffffff;
    color: var(--ink-700);
    border-color: var(--paper-300);
