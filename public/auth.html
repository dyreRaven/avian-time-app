<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Avian Time & Payroll – Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell auth-page">
      <main class="auth-main">
        <div class="card auth-card">
          <!-- Logo -->
          <div class="auth-logo">
            <div class="sidebar-logo-mark">
              <img src="/images/logo.png" alt="Avian Group logo" />
            </div>
            <div>
              <div class="sidebar-title">Avian Group</div>
            </div>
          </div>

          <div class="auth-header-text">
            <h2>Sign up</h2>
          </div>

          <div class="card-body">
            <!-- Sign in form -->
            <form id="login-form" class="stack-vert hidden" autocomplete="on">
              <div id="login-step-email" class="stack-vert">
                <label>
                  <span class="field-label">Email</span>
                  <input
                    id="login-email"
                    type="email"
                    required
                    autocomplete="email"
                  />
                </label>

                <button type="button" id="login-continue" class="btn primary w-full">
                  Continue
                </button>
              </div>

              <div id="login-step-password" class="stack-vert hidden">
                <div class="auth-email-row">
                  <div class="auth-email-meta">
                    <span class="auth-email-label">Email</span>
                    <span id="login-email-display" class="auth-email-value"></span>
                  </div>
                  <button type="button" id="login-change-email" class="btn tertiary">
                    Change
                  </button>
                </div>

                <label>
                  <span class="field-label">Password</span>
                  <div class="auth-password-wrap">
                    <input
                      id="login-password"
                      type="password"
                      required
                      autocomplete="current-password"
                    />
                    <button
                      type="button"
                      id="password-toggle"
                      class="auth-password-toggle"
                      aria-pressed="false"
                      aria-label="Show password"
                    >
                      <svg
                        id="password-toggle-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path
                          d="M12 5c-5 0-9 5-9 7s4 7 9 7 9-5 9-7-4-7-9-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"
                          fill="currentColor"
                        />
                      </svg>
                    </button>
                  </div>
                </label>

                <label class="checkbox-inline auth-remember">
                  <input type="checkbox" id="login-remember" />
                  <span>Stay Signed In</span>
                </label>

                <button type="submit" class="btn primary w-full">
                  Sign in
                </button>
              </div>
            </form>

            <!-- Password setup form (invite/reset) -->
            <form id="setup-form" class="stack-vert hidden" autocomplete="off">
              <div class="auth-email-row">
                <div class="auth-email-meta">
                  <span class="auth-email-label">Email</span>
                  <span id="setup-email-display" class="auth-email-value"></span>
                </div>
              </div>

              <label>
                <span class="field-label">New password</span>
                <input
                  id="setup-password"
                  type="password"
                  minlength="8"
                  required
                  autocomplete="new-password"
                />
              </label>

              <label>
                <span class="field-label">Confirm password</span>
                <input
                  id="setup-password-confirm"
                  type="password"
                  minlength="8"
                  required
                  autocomplete="new-password"
                />
              </label>

              <button type="submit" class="btn primary w-full">
                Set password
              </button>
              <button type="button" id="setup-cancel" class="btn secondary w-full">
                Back to sign in
              </button>
            </form>


            <!-- Bootstrap form (hidden by default) -->
            <form
              id="bootstrap-form"
              class="stack-vert"
              autocomplete="on"
            >
              <div id="bootstrap-step-account" class="stack-vert">
                <label>
                  <span class="field-label">Admin email</span>
                  <input
                    id="bootstrap-email"
                    type="email"
                    required
                    autocomplete="email"
                  />
                </label>

                <label>
                  <span class="field-label">Password</span>
                  <input
                    id="bootstrap-password"
                    type="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                  />
                </label>

                <label>
                  <span class="field-label">Confirm password</span>
                  <input
                    id="bootstrap-password-confirm"
                    type="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                  />
                </label>

                <button type="button" id="bootstrap-continue" class="btn primary w-full">
                  Sign up
                </button>
              </div>

              <div id="bootstrap-step-org" class="stack-vert hidden">
                <div class="auth-email-row">
                  <div class="auth-email-meta">
                    <span class="auth-email-label">Admin email</span>
                    <span id="bootstrap-email-display" class="auth-email-value"></span>
                  </div>
                </div>

                <label>
                  <span class="field-label">Organization name</span>
                  <input
                    id="bootstrap-org-name"
                    type="text"
                    required
                    autocomplete="organization"
                  />
                </label>

                <label>
                  <span class="field-label">Organization timezone</span>
                  <select id="bootstrap-org-timezone" required></select>
                </label>

                <label>
                  <span class="field-label">Admin first name</span>
                  <input
                    id="bootstrap-admin-first-name"
                    type="text"
                    required
                    autocomplete="given-name"
                  />
                </label>

                <label>
                  <span class="field-label">Admin last name</span>
                  <input
                    id="bootstrap-admin-last-name"
                    type="text"
                    required
                    autocomplete="family-name"
                  />
                </label>

                <button type="submit" class="btn primary w-full">
                  Create company admin
                </button>
              </div>
            </form>

            <p id="auth-message" class="message auth-message"></p>

            <div id="org-select" class="auth-org-select hidden">
              <div class="auth-org-title">Select organization</div>
              <div id="org-select-list" class="stack-vert"></div>
            </div>

            <div id="auth-toggle" class="auth-toggle hidden">
              <span id="auth-toggle-text">First time here?</span>
              <button
                id="auth-toggle-btn"
                type="button"
                class="btn tertiary"
              >
                Create company admin
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      // Fallback for environments where cached JS might be stale
      window.fetchJSON = window.fetchJSON || (async (url, options = {}) => {
        const res = await fetch(url, options);
        let data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        if (!res.ok) {
          const msg = data.error || data.message || 'Request failed';
          throw new Error(msg);
        }
        return data;
      });
    </script>
    <script src="/auth.js"></script>
  </body>
</html>
